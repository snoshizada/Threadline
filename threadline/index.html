<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Threadline</title>
<meta name="description" content="A calm calendar organised by what you're keeping up with.">
<meta name="theme-color" content="#f4f0e8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1c1a17" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Threadline">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body data-view="threads">

<header class="topbar" id="topbar">
  <div class="topbar-in">
    <a class="brand" href="./">
      <svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="16" class="logo-bg"/><path d="M12 36h40" class="logo-rail" stroke-width="2.5" stroke-linecap="round"/><circle cx="18" cy="36" r="4.5" fill="var(--c-sage)"/><circle cx="29" cy="36" r="4.5" fill="var(--c-rust)"/><rect x="34.75" y="24" width="2.5" height="24" rx="1.25" class="logo-now"/><circle cx="45" cy="36" r="4" class="logo-bg" stroke="var(--c-cobalt)" stroke-width="2.5"/></svg>
      <span>Threadline</span>
    </a>
    <div class="seg" role="tablist">
      <button class="on" data-act="view" data-v="threads" role="tab">Threads</button>
      <button data-act="view" data-v="horizon" role="tab">Horizon</button>
    </div>
    <div class="top-right">
      <span class="today mono" id="today"></span>
      <button class="icon-btn" data-act="menu" aria-label="Settings">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
      </button>
    </div>
  </div>
</header>

<main class="wrap">
  <div class="hello" id="hello"></div>
  <div class="grid">
    <section class="panel" id="threads"></section>
    <section class="panel" id="horizon"></section>
  </div>
</main>

<button class="fab" data-act="new">
  <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
  New
</button>

<div class="menu menu-new" id="new-menu" hidden>
  <button data-act="new-thread"><i class="mi">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 12h18"/><circle cx="7" cy="12" r="2.2" fill="currentColor"/><circle cx="17" cy="12" r="2.2"/></svg></i>
    <span><b>Thread</b><small>Something you keep up with</small></span></button>
  <button data-act="new-event"><i class="mi">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="5"/></svg></i>
    <span><b>Event</b><small>Happens at a time</small></span></button>
  <button data-act="new-due"><i class="mi">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 6l6 6-6 6-6-6z"/></svg></i>
    <span><b>Deadline</b><small>Needs doing by a day</small></span></button>
  <button data-act="new-todo"><i class="mi">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-dasharray="3 2.5"><rect x="4" y="8" width="16" height="8" rx="4"/></svg></i>
    <span><b>To-do</b><small>Date it later, or never</small></span></button>
</div>

<div class="menu menu-settings" id="settings-menu" hidden>
  <button data-act="theme"><span id="theme-label">Theme: Auto</span></button>
  <button data-act="export"><span>Export backup</span></button>
  <button data-act="import"><span>Import backup</span></button>
  <hr>
  <button data-act="reset"><span>Load demo data</span></button>
  <button data-act="empty" class="danger"><span>Start empty</span></button>
</div>

<div class="sheet-wrap" id="sheet" hidden>
  <div class="sheet-bg" data-act="close"></div>
  <form class="sheet" id="sheet-form" autocomplete="off" novalidate></form>
</div>

<div class="toast" id="toast" hidden></div>
<input type="file" id="import-file" accept="application/json,.json" hidden>

<script src="app.js"></script>
</body>
</html>
